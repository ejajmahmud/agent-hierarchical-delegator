[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hierarchical-delegator"
version = "0.1.0"
description = "Capability-matrix-driven recursive task decomposition engine dispatching subtasks to specialized subagents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-hierarchical-delegator = "agent_hierarchical_delegator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_hierarchical_delegator*"]
